services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tunnel
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: tunnel
    ports:
      # Keep the host port non-standard to avoid a conflict with local PostgreSQL.
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel -d tunnel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      PUBLIC_BASE_DOMAIN: tunnel.localhost
      DATABASE_URL: postgres://tunnel:tunnel@postgres:5432/tunnel?sslmode=disable
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: development-access-secret-change-me
      JWT_REFRESH_SECRET: development-refresh-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8095:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
